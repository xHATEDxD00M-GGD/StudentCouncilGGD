<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suggestions - Student Council</title>
  <style>
:root {
  --navy: #16233f;
  --navy-light: #24365c;
  --gold: #eab308;
  --gold-dark: #ca8a04;
  --bg: #f5f6fa;
  --card: #ffffff;
  --border: #e3e6ee;
  --text: #1c2333;
  --muted: #656d80;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 16px rgba(16,24,40,.07);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

.wrap { max-width: 920px; margin: 0 auto; padding: 0 24px; }

/* Header */
.site-header {
  background: linear-gradient(135deg, var(--navy), var(--navy-light));
  box-shadow: var(--shadow);
}
.header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 24px;
  flex-wrap: wrap;
  gap: 10px;
}
.brand {
  color: white;
  font-weight: 700;
  font-size: 1.25rem;
  text-decoration: none;
  letter-spacing: -0.01em;
}
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a {
  color: #cfd6e6;
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 500;
  font-size: 0.95rem;
  transition: background 0.15s, color 0.15s;
}
nav a:hover { background: rgba(255,255,255,0.1); color: white; }

.page { padding: 44px 24px 70px; }

/* Hero */
.hero {
  background: linear-gradient(135deg, var(--navy), var(--navy-light));
  border-radius: var(--radius);
  padding: 48px 40px;
  color: white;
  box-shadow: var(--shadow);
  margin-bottom: 8px;
}
.hero h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 2.4rem;
  margin: 0 0 14px;
  letter-spacing: -0.01em;
}
.hero .lead { color: #d7dcea; max-width: 620px; font-size: 1.08rem; }
.cta-row { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }

h1 {
  font-family: Georgia, "Times New Roman", serif;
  color: var(--navy);
  font-size: 2rem;
  letter-spacing: -0.01em;
}
.lead { color: var(--muted); font-size: 1.05rem; max-width: 640px; }

/* Buttons */
.btn {
  display: inline-block;
  padding: 11px 22px;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 600;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
  transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
}
.btn-primary { background: var(--gold); color: var(--navy); box-shadow: 0 2px 8px rgba(234,179,8,0.35); }
.btn-primary:hover { background: var(--gold-dark); transform: translateY(-1px); }
.btn-secondary { background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.35); }
.btn-secondary:hover { background: rgba(255,255,255,0.2); transform: translateY(-1px); }
.btn-sm { padding: 7px 14px; font-size: 0.85rem; }

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin-top: 24px;
  box-shadow: var(--shadow);
}
.card h2 {
  margin-top: 0;
  color: var(--navy);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.35rem;
}

/* Video embeds */
.video-embed {
  position: relative;
  padding-bottom: 56.25%;
  height: 0;
  overflow: hidden;
  border-radius: 10px;
  background: #000;
}
.video-embed iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: 0;
}
.video-grid .card:first-child { margin-top: 0; }

/* About members */
.members-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 18px;
  margin-top: 14px;
}
.member-card { text-align: center; }
.avatar {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--navy), var(--navy-light));
  color: var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.4rem;
  margin: 0 auto 10px;
  box-shadow: var(--shadow);
}
.member-name { font-weight: 600; margin: 0; }
.member-role { color: var(--muted); margin: 0; font-size: 0.9rem; }

/* Forms */
.form { display: flex; flex-direction: column; gap: 6px; }
.form label { font-weight: 600; margin-top: 12px; font-size: 0.9rem; }
.form input, .form textarea {
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 1rem;
  font-family: inherit;
  background: #fbfbfd;
}
.form input:focus, .form textarea:focus {
  outline: none;
  border-color: var(--gold);
  background: white;
}
.form button { margin-top: 20px; align-self: flex-start; }

/* Alerts */
.alert { padding: 13px 18px; border-radius: 10px; margin-top: 20px; font-weight: 500; }
.alert-success { background: #e7f7ec; color: #16794a; }
.alert-error { background: #fdeceb; color: #b3261e; }

/* Footer */
.site-footer {
  border-top: 1px solid var(--border);
  padding: 24px 0;
  color: var(--muted);
  font-size: 0.85rem;
  text-align: center;
}
.site-footer a { color: var(--muted); }

@media (max-width: 640px) {
  .hero { padding: 32px 24px; }
  .hero h1 { font-size: 1.8rem; }
  .header-inner { flex-direction: column; align-items: flex-start; }
}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">🎓 Student Council</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="videos.html">Videos</a>
        <a href="suggestions.html">Suggestions</a>
      </nav>
    </div>
  </header>

  <main class="wrap page">
    <h1>Got an idea?</h1>
    <p class="lead">Suggestions go straight to the council. Leave your name if you want a reply, or stay anonymous.</p>

    <!--
      SETUP REQUIRED (one-time, ~3 minutes):
      1. Go to https://forms.google.com and sign in with any Google account.
      2. Click "Blank form". Add three questions: Name (short answer, not required),
         Topic (short answer, not required), Suggestion (paragraph, required).
      3. Click Send (top right).
      4. In the Send dialog, click the "< >" embed icon.
      5. Copy ONLY the URL inside the quotes of the src="..." attribute it gives you
         (it looks like https://docs.google.com/forms/d/e/XXXXXXX/viewform?embedded=true).
      6. Paste that URL below, replacing YOUR_GOOGLE_FORM_EMBED_URL.

      To get responses emailed to you: in the Google Form editor, click "Responses"
      tab, then the three-dot menu, then "Get email notifications for new responses".
      You can also see every response as a live spreadsheet from that same tab.
    -->
    <section class="card">
      <div class="video-embed" style="padding-bottom: 120%;">
        <iframe
          src="YOUR_GOOGLE_FORM_EMBED_URL"
          title="Student Council Suggestion Form"
          frameborder="0"
          marginheight="0"
          marginwidth="0">
          Loading form…
        </iframe>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; 2026 Student Council</p>
    </div>
  </footer>
</body>
</html>
