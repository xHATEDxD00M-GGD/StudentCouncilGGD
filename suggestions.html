<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suggestions - Student Council</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">🎓 Student Council</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="videos.html">Videos</a>
        <a href="suggestions.html">Suggestions</a>
      </nav>
    </div>
  </header>

  <main class="wrap page">
    <h1>Got an idea?</h1>
    <p class="lead">Suggestions go straight to the council. Leave your name if you want a reply, or stay anonymous.</p>

    <div id="thanks-banner" class="alert alert-success" style="display: none;">
      Thanks! Your suggestion was submitted.
    </div>

    <!--
      SETUP REQUIRED (one-time, ~2 minutes):
      1. Go to https://formspree.io and sign up free (email + password, no card needed).
      2. Create a new form. Formspree gives you a URL like:
         https://formspree.io/f/abcd1234
      3. Replace YOUR_FORM_ID below (in the form's "action" attribute) with your real form ID.
      4. That's it — every submission will land in your email inbox AND in your Formspree dashboard.
    -->
    <section class="card">
      <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="form" id="suggestion-form">
        <label for="name">Your name (optional)</label>
        <input type="text" id="name" name="name" placeholder="Leave blank to stay anonymous" />

        <label for="topic">Topic (optional)</label>
        <input type="text" id="topic" name="topic" placeholder="e.g. Cafeteria, Events, Spirit Week" />

        <label for="message">Your suggestion *</label>
        <textarea id="message" name="message" rows="6" required placeholder="What would you like to see change or happen?"></textarea>

        <!-- Formspree-specific fields -->
        <input type="hidden" name="_subject" value="New student council suggestion" />
        <input type="hidden" name="_next" value="suggestions.html?sent=1" />
        <!-- Honeypot: Formspree auto-discards any submission where this is filled in -->
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" />

        <button type="submit" class="btn btn-primary">Send Suggestion</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; 2026 Student Council</p>
    </div>
  </footer>

  <script>
    // Show a thank-you banner after Formspree redirects back with ?sent=1
    if (window.location.search.includes('sent=1')) {
      document.getElementById('thanks-banner').style.display = 'block';
      document.getElementById('suggestion-form').style.display = 'none';
    }
  </script>
</body>
</html>
